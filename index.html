<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta property="og:title" content="SKMS 아고라 — SKMS에 대해 어떻게 생각하세요?">
<meta property="og:description" content="열 가지 생각거리에 답하고, 나만의 SKMS 한 줄을 남기고, Next SKMS를 위한 제안을 나눠요.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#3182F6">
</head>
<body>
<title>SKMS 아고라</title>
<script src="./config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  color-scheme: light;
  --ground:#FFFFFF; --soft:#F2F4F6; --soft-2:#E8EBEF; --line:#E5E8EB;
  --ink:#191F28; --ink-2:#4E5968; --ink-3:#8B95A1; --ink-4:#B0B8C1;
  --blue:#3182F6; --blue-ink:#FFFFFF; --blue-soft:#E8F3FF; --blue-deep:#1B64DA;
  --agree:#3182F6; --unsure:#98A2AE; --disagree:#E5533F; --disagree-soft:#FDECEA;
  --radius:20px; --radius-s:14px; --w:520px;
  --shadow:0 2px 8px rgba(0,0,0,.04), 0 12px 32px -12px rgba(25,31,40,.14);
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{margin:0;color:var(--ink);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance;line-height:1.3}
h1{font-size:1.7rem;font-weight:900} h2{font-size:1.25rem} h3{font-size:1.02rem}
p{margin:0}
button{font:inherit;cursor:pointer;letter-spacing:inherit}
input,textarea,select{font:inherit;color:var(--ink);background:var(--soft);border:2px solid transparent;border-radius:var(--radius-s);padding:14px 16px;width:100%;font-size:1.02rem}
input:focus,textarea:focus{outline:0;border-color:var(--blue);background:#fff}
button:focus-visible{outline:3px solid var(--blue-soft);outline-offset:1px}
textarea{resize:none;min-height:110px;font-size:1rem;line-height:1.6}
.muted{color:var(--ink-2)} .tiny{font-size:.82rem;color:var(--ink-3)} .num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.wrap{max-width:var(--w);margin:0 auto;padding-inline:20px;padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(8px)}
header.top .in{max-width:var(--w);margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:900;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--blue);display:inline-block}
.brand .mode{font-size:.68rem;font-weight:700;color:var(--ink-3);background:var(--soft);border-radius:999px;padding:2px 8px;margin-left:4px}
.hbtn{background:none;border:0;color:var(--ink-3);font-size:.88rem;padding:6px 8px;border-radius:8px}
.hbtn:hover{background:var(--soft)}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--ink-2);padding:8px 0;font-size:.95rem}
.back::before{content:"←";font-size:1.1rem}

.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav .in{max-width:var(--w);margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.bnav button{font-size:.68rem}
.bnav button{background:none;border:0;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-4);font-size:.72rem;font-weight:600}
.bnav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bnav button[aria-current="page"]{color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:var(--blue-ink);border:0;border-radius:var(--radius-s);padding:16px 20px;font-weight:700;font-size:1.05rem;width:100%;transition:transform .08s ease,background .15s}
.btn:active{transform:scale(.985)} .btn:hover{background:var(--blue-deep)}
.btn.sub{background:var(--soft);color:var(--ink-2)} .btn.sub:hover{background:var(--soft-2)}
.btn.sm{width:auto;padding:10px 16px;font-size:.92rem;border-radius:12px}
.btn.xs{width:auto;padding:6px 12px;font-size:.82rem;border-radius:10px}
.btn:disabled{background:var(--soft-2);color:var(--ink-4);cursor:not-allowed}
.cta{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,#fff 70%,rgba(255,255,255,0));z-index:4}
.cta .in{max-width:var(--w);margin:0 auto;display:flex;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--soft);color:var(--ink-2);border-radius:999px;padding:10px 16px;font-size:.98rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip.ghost{background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:.88rem;color:var(--ink-3);font-weight:500;padding-left:2px}
.step{animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 12px;gap:10px}
.sec h2{font-size:1.15rem} .sec .tiny{text-align:right}
.banner{background:var(--blue-soft);color:var(--blue-deep);border-radius:var(--radius-s);padding:12px 16px;font-size:.92rem;font-weight:500;margin-top:14px}
.banner.warn{background:#FFF4E0;color:#8A5300}

/* home */
.hero{padding-block:22px 18px}
.hero p{margin-top:8px;color:var(--ink-2);font-size:1.02rem}
.prog{margin-top:16px;background:var(--soft);border-radius:999px;height:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .5s ease}
.agendas{display:grid;grid-template-columns:1fr;gap:12px}
.ag{position:relative;text-align:left;border:0;background:var(--soft);border-radius:var(--radius);padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;transition:transform .12s ease,background .15s}
.ag:hover{background:var(--soft-2)} .ag:active{transform:scale(.98)}
.ag .t{font-size:.78rem;color:var(--ink-3);font-weight:600}
.ag .s{font-weight:700;font-size:1.05rem;line-height:1.4;letter-spacing:-.02em;text-wrap:pretty;margin-top:6px}
.ag .foot{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--ink-3);margin-top:8px}
.ag .mark{font-weight:700}
.ag .mark.agree{color:var(--agree)} .ag .mark.disagree{color:var(--disagree)} .ag .mark.unsure{color:var(--ink-2)}
.ag .newdot{position:absolute;top:16px;right:16px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.ag.done{background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.mini{height:26px;border-radius:8px;overflow:hidden;display:flex;background:var(--soft-2);gap:2px}
.mini i{display:flex;align-items:center;justify-content:center;height:100%;font-size:.78rem;font-weight:800;color:#fff;font-style:normal;overflow:hidden;white-space:nowrap}
.mini .a{background:var(--agree)} .mini .u{background:var(--unsure)} .mini .d{background:var(--disagree)}
.ag .big{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
.ag .big b{font-size:1.6rem;font-weight:900;letter-spacing:-.04em;line-height:1;color:var(--agree)}
.ag .big span{font-size:.8rem;color:var(--ink-3);font-weight:600}
.ag .lg{display:flex;justify-content:space-between;font-size:.72rem;color:var(--ink-3);margin-top:5px}
.ag .lg b{font-weight:700;color:var(--ink-2)}
.ag .lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.final{background:var(--ink);color:#fff;border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:6px;text-align:left;border:0;width:100%;margin-top:12px}
.final b{font-size:1.1rem} .final span{color:rgba(255,255,255,.72);font-size:.92rem}

/* detail */
.d-ctx{color:var(--ink-3);font-size:.9rem;margin-top:14px}
.d-st{font-size:1.55rem;font-weight:900;line-height:1.35;letter-spacing:-.03em;margin-top:8px}
.steps{display:flex;gap:6px;margin-top:18px}
.steps i{flex:1;height:4px;border-radius:999px;background:var(--soft-2)} .steps i.on{background:var(--blue)}
.stances{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.stance{border:0;background:var(--soft);border-radius:var(--radius-s);padding:18px 20px;text-align:left;font-size:1.1rem;font-weight:700;display:flex;justify-content:space-between;align-items:center;transition:transform .08s ease,background .15s}
.stance:active{transform:scale(.985)}
.stance small{font-weight:400;color:var(--ink-3);font-size:.85rem}
.stance[data-s="agree"]:hover,.stance[data-s="agree"].on{background:var(--blue-soft);color:var(--blue-deep)}
.stance[data-s="unsure"]:hover,.stance[data-s="unsure"].on{background:var(--soft-2);color:var(--ink)}
.stance[data-s="disagree"]:hover,.stance[data-s="disagree"].on{background:var(--disagree-soft);color:var(--disagree)}
.why{margin-top:24px}
.why .cnt{text-align:right;font-size:.8rem;color:var(--ink-4);margin-top:4px}
.samples{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.samples button{border:0;background:#fff;box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:7px 12px;font-size:.85rem;color:var(--ink-2)}
.fill{font-size:1.35rem;font-weight:900;letter-spacing:-.03em;line-height:1.4;margin-top:6px}
.fill em{font-style:normal;color:var(--blue);border-bottom:3px solid var(--blue);padding:0 4px}

/* result */
.res-head .big{font-size:2.5rem;font-weight:900;letter-spacing:-.04em;line-height:1.1}
.res-head .big span{font-size:1.05rem;font-weight:700;color:var(--ink-2);margin-left:6px;letter-spacing:-.02em}
.res-head p{color:var(--ink-2);margin-top:6px}
.bar{height:30px;border-radius:9px;overflow:hidden;display:flex;gap:2px;background:var(--soft);margin-top:18px}
.bar i{display:flex;align-items:center;justify-content:center;height:100%;transition:width .6s cubic-bezier(.2,.7,.2,1);font-size:.85rem;font-weight:800;color:#fff;font-style:normal;overflow:hidden;white-space:nowrap}
.bar .a{background:var(--agree)} .bar .u{background:var(--unsure)} .bar .d{background:var(--disagree)}
.legend{display:flex;gap:14px;margin-top:10px;font-size:.86rem;color:var(--ink-2);flex-wrap:wrap}
.legend b{font-weight:700;color:var(--ink)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tabs{display:flex;gap:6px;margin:22px 0 12px;background:var(--soft);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:600;color:var(--ink-3);font-size:.9rem}
.tabs button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.reasons{display:flex;flex-direction:column;gap:10px}
.rs{background:var(--soft);border-radius:var(--radius-s);padding:14px 16px}
.rs p{font-size:.98rem;line-height:1.55}
.rs .m{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:.78rem;color:var(--ink-3);gap:8px}
.rs.mine{box-shadow:inset 0 0 0 1.5px var(--blue)}
.rs.q p{font-weight:600;font-size:1.02rem}
.like{background:#fff;border:0;border-radius:999px;padding:4px 10px;font-size:.8rem;color:var(--ink-2);white-space:nowrap}
.like.on{background:var(--blue-soft);color:var(--blue-deep);font-weight:700}
.empty{padding:24px 16px;text-align:center;color:var(--ink-3);background:var(--soft);border-radius:var(--radius-s);font-size:.95rem}
.lock{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:var(--radius-s);padding:14px 16px;color:var(--ink-2);font-size:.92rem}
.mine-box{background:var(--blue-soft);border-radius:var(--radius-s);padding:14px 16px;margin-top:16px}
.mine-box .k{font-size:.78rem;color:var(--blue-deep);font-weight:700}
.mine-box p{margin-top:4px;font-weight:600}
.mine-box .x{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* results */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-top:14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters select{border:0;background:var(--soft);border-radius:999px;padding:8px 32px 8px 14px;font-size:.9rem;color:var(--ink-2);appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%238B95A1' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;flex:0 0 auto;width:auto}
.insights{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
@media (max-width:400px){.insights{grid-template-columns:1fr}}
.ins{border-radius:var(--radius);padding:18px;background:var(--soft);display:flex;flex-direction:column;gap:6px;min-height:130px}
.ins .k{font-size:.78rem;font-weight:700;color:var(--ink-3)}
.ins .v{font-size:1.9rem;font-weight:900;letter-spacing:-.04em;line-height:1.05}
.ins .v small{font-size:.9rem;font-weight:600;color:var(--ink-2);margin-left:4px;letter-spacing:-.01em}
.ins .s{font-size:.9rem;color:var(--ink-2);line-height:1.4;text-wrap:pretty}
.ins.hero{grid-column:1/-1;background:var(--ink);color:#fff}
.ins.hero .k{color:rgba(255,255,255,.6)} .ins.hero .s{color:rgba(255,255,255,.85)}
.ins.hero .v{font-size:1.5rem;line-height:1.3;letter-spacing:-.03em;margin-top:4px}
.ins.blue{background:var(--blue-soft)} .ins.blue .v{color:var(--blue-deep)}
.ins.red{background:var(--disagree-soft)} .ins.red .v{color:var(--disagree)}
.dmap{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.dmap .hd{display:grid;grid-template-columns:1fr 1fr;font-size:.75rem;color:var(--ink-3);font-weight:600;padding:0 2px 4px}
.dmap .hd span:last-child{text-align:right}
.drow{display:block;width:100%;border:0;background:none;text-align:left;padding:8px 0;border-radius:10px}
.drow:hover{background:var(--soft)}
.drow .lab{font-size:.9rem;font-weight:600;line-height:1.35;display:flex;justify-content:space-between;gap:10px}
.drow .lab .tg{color:var(--ink-3);font-weight:500;font-size:.78rem;white-space:nowrap}
.drow .tr{position:relative;height:20px;margin-top:6px}
.drow .tr::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--ink-4);border-radius:2px;transform:translateX(-50%)}
.drow .l,.drow .r{position:absolute;top:0;height:100%;border-radius:4px}
.drow .l{right:50%;background:var(--disagree);border-radius:6px 0 0 6px}
.drow .r{left:50%;background:var(--agree);border-radius:0 6px 6px 0}
.drow .pl,.drow .pr{position:absolute;top:0;height:100%;display:flex;align-items:center;font-size:.78rem;font-weight:700;padding:0 6px}
.drow .pl{color:var(--disagree)} .drow .pr{color:var(--agree)}
.heat{display:grid;gap:4px;margin-top:8px;font-size:.78rem}
.heat .hh{color:var(--ink-3);font-weight:600;text-align:center;padding-bottom:2px;font-size:.7rem;line-height:1.2}
.heat .hl{color:var(--ink-2);font-weight:600;padding-right:6px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat .hc{height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink)}
.heat .hc.na{background:var(--soft);color:var(--ink-4);font-weight:500} .heat .hc.dk{color:#fff}
.hscale{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.75rem;color:var(--ink-3)}
.hscale i{flex:1;height:8px;border-radius:999px;background:linear-gradient(to right,#EEF4FF,#3182F6)}
.cbars{display:flex;flex-direction:column;gap:8px}
.cb{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:.88rem}
.cb .tk{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.cb .tk i{display:block;height:100%;background:var(--ink-2);border-radius:999px}
.cb .n{text-align:right;color:var(--ink-2)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.pair .pc{background:var(--soft);border-radius:var(--radius-s);padding:14px}
.pair .pc .k{font-size:.78rem;color:var(--ink-3);font-weight:600}
.pair .pc .v{font-size:1.5rem;font-weight:900;letter-spacing:-.03em;color:var(--blue-deep)}
.pair .pc .v small{font-size:.8rem;color:var(--ink-3);font-weight:500;margin-left:2px}

/* ours */
.theme{margin-top:22px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:var(--radius);padding:18px}
.theme .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.theme .pr{font-size:1.05rem;font-weight:800;letter-spacing:-.02em;line-height:1.35}
.theme .pr em{font-style:normal;color:var(--blue)}
.theme .lst{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sent{background:var(--soft);border-radius:12px;padding:12px 14px}
.sent p{font-size:.98rem;line-height:1.55;font-weight:500}
.sent .m{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:.76rem;color:var(--ink-3);gap:8px}
.sent.mine{box-shadow:inset 0 0 0 1.5px var(--blue)}
.theme .more{margin-top:10px;background:none;border:0;color:var(--blue);font-weight:700;font-size:.9rem;padding:4px 0}
.theme .add{margin-top:12px;display:flex;gap:8px}

/* ideas */
.topics{display:flex;gap:8px;overflow-x:auto;margin-top:14px;scrollbar-width:none;padding-bottom:2px}
.topics::-webkit-scrollbar{display:none}
.topics button{border:0;background:var(--soft);color:var(--ink-2);border-radius:999px;padding:8px 14px;font-size:.88rem;font-weight:600;white-space:nowrap}
.topics button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tdesc{background:var(--blue-soft);border-radius:var(--radius-s);padding:14px 16px;margin-top:12px}
.tdesc b{color:var(--blue-deep);font-size:.98rem}
.tdesc p{font-size:.9rem;color:var(--ink-2);margin-top:4px}
.idea{background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:var(--radius);padding:16px 18px;margin-top:12px}
.idea.mine{box-shadow:inset 0 0 0 1.5px var(--blue)}
.idea .tp{font-size:.74rem;font-weight:700;color:var(--blue)}
.idea .bd{font-size:1rem;line-height:1.6;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.idea .m{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:.78rem;color:var(--ink-3);gap:8px;flex-wrap:wrap}
.idea .acts{display:flex;gap:6px;align-items:center}
.cmts{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.cmt{background:var(--soft);border-radius:10px;padding:9px 12px;font-size:.9rem;line-height:1.5}
.cmt .m{display:flex;justify-content:space-between;font-size:.74rem;color:var(--ink-3);margin-top:4px}
.cmt.mine{box-shadow:inset 0 0 0 1.5px var(--blue)}
.cform{display:flex;gap:8px;margin-top:8px}
.cform input{padding:9px 12px;font-size:.92rem;border-radius:10px}
.compose{background:var(--soft);border-radius:var(--radius);padding:16px;margin-top:14px}
.idea .bd.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.idea.pin{background:var(--blue-soft)}
.idea .pinl{font-size:.72rem;font-weight:700;color:var(--blue-deep);background:#fff;border-radius:999px;padding:2px 8px;margin-left:6px}
.reply{background:var(--soft);border-radius:var(--radius-s);padding:13px 15px}
.reply.idea-k{background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.reply.mine{box-shadow:inset 0 0 0 1.5px var(--blue)}

 {id:'a3',tag:'SUPEX',dir:'critical',statement:'SUPEX 추구는 때로 번아웃을 정당화하는 데 쓰인다',context:'인간의 능력으로 도달할 수 있는 최고 수준을 추구한다는 SUPEX. 현장에서는 어떻게 쓰이고 있나요.',prompt:'내가 다시 정의하는 SUPEX는',fill:'SUPEX란 ___',active:true},

 {id:'a5',tag:'패기',dir:'critical',statement:"'패기'라는 단어는 지금 세대에게 잘 와닿지 않는다",context:'SKMS는 패기를 "스스로 동기부여하여 문제를 정면으로 마주하는 것"으로 정의합니다.',prompt:"'패기'를 요즘 말로 바꾼다면",fill:'패기는 요즘 말로 ___',active:true},
 {id:'a6',tag:'이해관계자',dir:'affirming',statement:'우리 회사는 구성원 행복과 이해관계자 행복의 균형을 잘 지키고 있다',context:'SKMS는 구성원 행복과 이해관계자 행복의 조화를 말합니다.',prompt:'구성원과 이해관계자의 관계는',fill:'구성원과 이해관계자는 ___',active:true},
 {id:'a7',tag:'실천',dir:'critical',statement:'SKMS는 평가·보상과 연결되지 않으면 실천되지 않는다',context:'철학과 제도의 관계에 대한 질문입니다.',prompt:'SKMS가 살아 있는 조직이라면 매주 이런 장면이 보일 것이다',fill:'매주 ___이(가) 보인다',active:true},

 {id:'a9',tag:'AI 시대',dir:'critical',statement:'AI 시대에 맞춰 SKMS의 핵심 가치 자체를 다시 정의해야 한다',context:'표현만 바꿀 것인가, 내용까지 바꿀 것인가. 개정의 범위에 대한 질문입니다.',prompt:'AI 시대 SKMS에 새로 들어가야 할 한 줄',fill:'AI 시대 SKMS에는 ___',active:true},
 {id:'a10',tag:'정체성',dir:'affirming',statement:'SKMS는 지금도 SK를 다른 회사와 구별해 주는 것이다',context:'SKMS가 조직 안에서 어떤 의미로 존재하는지에 대한 질문입니다.',prompt:'SKMS는 SK에게',fill:'SKMS는 SK에게 ___이다',active:true},
];
const DEFAULT_TOPICS=[
 {id:'t1',title:'Next SKMS, 어떤 과정으로 만들까',desc:'개정을 누가, 어떤 순서로, 얼마나 열어 놓고 진행해야 할까요. 구성원 참여 방식, 검토 단계, 의사결정 방식에 대한 제안을 남겨 주세요.'},
 {id:'t2',title:'살아 있게 만드는 장치',desc:'문서로 끝나지 않고 매일의 일 속에서 SKMS가 쓰이게 하려면 어떤 제도·의식·도구가 필요할까요.'},
 {id:'t3',title:'AI 시대의 실천 아이디어',desc:'AI와 함께 일하는 환경에서 VWBE, SUPEX, 패기를 실제로 어떻게 실천할 수 있을지, 작은 실험 아이디어를 환영해요.'},
 {id:'t0',title:'자유 제안',desc:'위 주제에 없는 생각, 질문, 제안 무엇이든.'},
];
const FINAL={id:'final',tag:'종합',prompt:'그래서, 내가 생각하는 SKMS는',fill:'내가 생각하는 SKMS는 ___'};
const REASON_HINTS={agree:['현장에서 실제로 그렇게 느껴요','직접 겪은 사례가 있어요','신입에게 설명할 때 특히 그래요'],unsure:['둘 다 맞는 면이 있어요','판단할 정보가 부족해요','회사마다 다른 것 같아요'],disagree:['제 경험은 반대예요','원인이 다른 데 있다고 봐요','바꾸면 잃는 게 더 커요']};

/* ================= 데이터 계층 (local | remote) ================= */
const CFG=window.SKMS_CONFIG||{};
const REMOTE=!!(CFG.supabaseUrl&&CFG.supabaseAnonKey);
let sb=null;
function loadScript(src,timeout){return new Promise((res,rej)=>{const el=document.createElement('script');el.src=src;el.async=true;const t=setTimeout(()=>rej(new Error('timeout')),timeout||15000);el.onload=()=>{clearTimeout(t);res();};el.onerror=()=>{clearTimeout(t);rej(new Error('load failed'));};document.head.appendChild(el);});}
let S=null, me=null, adminOK=false, adminPin='', view={name:'home'}, ovFilter={company:'',tenure:'',entry:''}, lastLoad=0;
function defaultSettings(name){return {name:name||'SKMS 아고라',createdAt:new Date().toISOString().slice(0,10),reasonsPublic:true,sentencesPublic:true,showResultsBeforeVote:false,shuffle:true,notice:'',closeAt:'',allowedDomains:[],companies:DEFAULT_COMPANIES.slice(),agendas:JSON.parse(JSON.stringify(DEFAULT_AGENDAS)),ideasEnabled:true,ideasPublic:true,ideaTopics:JSON.parse(JSON.stringify(DEFAULT_TOPICS))};}
function defaults(){return {users:[],votes:[],sentences:[],likes:[],ideas:[],comments:[],settings:defaultSettings(),seeded:false};}
let CAMPS={};   // slug → settings (모든 회차)
let campaignMissing=false;
function normalizeSettings(st){const d=defaultSettings();for(const k in d)if(st[k]===undefined)st[k]=d[k];if(st.name==='SKMS 보이스')st.name='SKMS 아고라';return st;}
async function fetchAll(table){let out=[],from=0;for(;;){const {data,error}=await sb.from(table).select('*').eq('campaign',C).range(from,from+999);if(error)throw error;out=out.concat(data||[]);if(!data||data.length<1000)break;from+=1000;}return out;}
const ms=t=>typeof t==='number'?t:new Date(t).getTime();
async function remoteLoad(){
  const [u,v,s,l,ii,cc,st]=await Promise.all([fetchAll('users_public'),fetchAll('votes'),fetchAll('sentences'),fetchAll('likes'),fetchAll('ideas'),fetchAll('comments'),sb.from('settings').select('id,data')]);
  if(st.error)throw st.error;
  CAMPS={};(st.data||[]).forEach(r=>{CAMPS[r.id]=normalizeSettings(r.data||{});});
  campaignMissing=!CAMPS[C]&&C!=='main';
  if(!CAMPS[C])CAMPS[C]=defaultSettings();
  S={users:u.map(x=>({id:x.id,name:x.name||'',company:x.company,tenure:x.tenure,entry:x.entry,demo:false,at:ms(x.created_at)})),
     votes:v.map(x=>({id:x.id,uid:x.uid,aid:x.aid,stance:x.stance,reason:x.reason||'',hidden:!!x.hidden,at:ms(x.at)})),
     sentences:s.map(x=>({id:x.id,uid:x.uid,aid:x.aid,body:x.body,hidden:!!x.hidden,at:ms(x.at)})),
     ideas:ii.map(x=>({id:x.id,uid:x.uid,topic:x.topic,body:x.body,hidden:!!x.hidden,pinned:!!x.pinned,at:ms(x.at)})),
     comments:cc.map(x=>({id:x.id,uid:x.uid,ideaId:x.idea_id,kind:x.kind||'comment',body:x.body,hidden:!!x.hidden,at:ms(x.at)})),
     likes:l.map(x=>({tid:x.tid,uid:x.uid})),
     settings:CAMPS[C],seeded:true};
  lastLoad=Date.now();
}
function localLoad(){
  try{CAMPS=JSON.parse(localStorage.getItem(KEY_CAMPS)||'{}')||{};}catch(e){CAMPS={};}
  try{const raw=localStorage.getItem(KEYC);if(raw)S=JSON.parse(raw);}catch(e){}
  if(!S)S=defaults();S.ideas=S.ideas||[];S.comments=S.comments||[];
  campaignMissing=!CAMPS[C]&&C!=='main';
  if(CAMPS[C])S.settings=normalizeSettings(CAMPS[C]);else{normalizeSettings(S.settings);CAMPS[C]=S.settings;}
  if(!S.seeded&&C==='main'){seed();S.seeded=true;}
  S.seeded=true;localSave();
}
function localSave(){if(REMOTE)return;try{CAMPS[C]=S.settings;const {settings,...rest}=S;localStorage.setItem(KEYC,JSON.stringify(rest));localStorage.setItem(KEY_CAMPS,JSON.stringify(CAMPS));}catch(e){}}
function localCampaignData(slug){if(slug===C)return S;try{const raw=localStorage.getItem(KEY+'_'+slug);return raw?JSON.parse(raw):{users:[],votes:[],sentences:[],likes:[]};}catch(e){return {users:[],votes:[],sentences:[],likes:[]};}}
async function remoteTry(fn,msg){try{await fn();return true;}catch(e){console.error(e);toast(msg||'저장하지 못했어요. 네트워크를 확인해 주세요');return false;}}
const DB={
  async user(u){localSave();if(REMOTE)return remoteTry(async()=>{const row={id:u.id,campaign:C,name:u.name,company:u.company,tenure:u.tenure,entry:u.entry};const r=await sb.from('users').insert(row);if(r.error){if(r.error.code!=='23505')throw r.error;const r2=await sb.from('users').update({name:u.name,company:u.company,tenure:u.tenure,entry:u.entry}).eq('id',u.id);if(r2.error)throw r2.error;}});return true;},
  async vote(v){localSave();if(REMOTE)return remoteTry(()=>sb.from('votes').upsert({id:v.id,campaign:C,uid:v.uid,aid:v.aid,stance:v.stance,reason:v.reason,at:new Date(v.at).toISOString()}).then(r=>{if(r.error)throw r.error;}));return true;},
  async sentence(s){localSave();if(REMOTE)return remoteTry(()=>sb.from('sentences').upsert({id:s.id,campaign:C,uid:s.uid,aid:s.aid,body:s.body,at:new Date(s.at).toISOString()}).then(r=>{if(r.error)throw r.error;}));return true;},
  async delSentence(id){localSave();if(REMOTE)return remoteTry(()=>sb.from('sentences').delete().eq('id',id).then(r=>{if(r.error)throw r.error;}));return true;},
  async idea(i){localSave();if(REMOTE)return remoteTry(()=>sb.from('ideas').upsert({id:i.id,campaign:C,uid:i.uid,topic:i.topic,body:i.body,at:new Date(i.at).toISOString()}).then(r=>{if(r.error)throw r.error;}));return true;},
  async delIdea(id){localSave();if(REMOTE)return remoteTry(()=>sb.from('ideas').delete().eq('id',id).then(r=>{if(r.error)throw r.error;}));return true;},
  async comment(c){localSave();if(REMOTE)return remoteTry(()=>sb.from('comments').insert({id:c.id,campaign:C,uid:c.uid,idea_id:c.ideaId,kind:c.kind||'comment',body:c.body,at:new Date(c.at).toISOString()}).then(r=>{if(r.error)throw r.error;}));return true;},
  async delComment(id){localSave();if(REMOTE)return remoteTry(()=>sb.from('comments').delete().eq('id',id).then(r=>{if(r.error)throw r.error;}));return true;},
  async like(tid,uid,on){localSave();if(REMOTE)return remoteTry(()=>(on?sb.from('likes').insert({tid,uid,campaign:C}):sb.from('likes').delete().eq('tid',tid).eq('uid',uid)).then(r=>{if(r.error&&r.error.code!=='23505')throw r.error;}));return true;},
  async admin(action,payload){
    if(!REMOTE){return {ok:true};}
    const {data,error}=await sb.rpc('admin_exec',{p_pin:adminPin,p_action:action,p_payload:payload||{}});
    if(error)throw error;return data;

async function toggleLike(tid){const ix=S.likes.findIndex(l=>l.tid===tid&&l.uid===me.id);const on=ix<0;if(on)S.likes.push({tid,uid:me.id});else S.likes.splice(ix,1);render();await DB.like(tid,me.id,on);}

const who=u=>u?`${esc(u.tenure||'')} · ${esc(u.company||'')}`:'';
function hash32(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
async function makeUid(email){const e=email.trim().toLowerCase();try{if(crypto&&crypto.subtle){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('skms-voice|'+e));return 'u_'+Array.from(new Uint8Array(buf)).slice(0,14).map(b=>b.toString(16).padStart(2,'0')).join('')+'_'+C;}}catch(err){}return 'u_'+hash32(e).toString(16)+hash32(e.split('').reverse().join('')).toString(16)+'_'+C;}
function orderedAgendas(){const list=activeAgendas();if(!S.settings.shuffle||!me)return list;const r=rng(hash32(me.id));const a=list.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const inFilter=(u,f)=>!!u&&(!f.company||u.company===f.company)&&(!f.tenure||u.tenure===f.tenure)&&(!f.entry||u.entry===f.entry);
function tally(aid,filter){
  const um=umap();
  const vs=S.votes.filter(v=>v.aid===aid&&(filter?inFilter(um[v.uid],filter):!!um[v.uid]));
  const c={agree:0,unsure:0,disagree:0};vs.forEach(v=>c[v.stance]++);
  return {n:vs.length,...c,pa:pct(c.agree,vs.length),pu:pct(c.unsure,vs.length),pd:pct(c.disagree,vs.length),votes:vs};
}
const segs=(t,min)=>['a','u','d'].map((k,i)=>{const p=[t.pa,t.pu,t.pd][i];return `<i class="${k}" style="width:${p}%">${p>=min?p+'%':''}</i>`;}).join('');
const barHtml=t=>`<div class="bar" role="img" aria-label="동의 ${t.pa}%, 모름 ${t.pu}%, 비동의 ${t.pd}%">${segs(t,12)}</div>`;
const miniHtml=t=>`<div class="mini" role="img" aria-label="동의 ${t.pa}%, 모름 ${t.pu}%, 비동의 ${t.pd}%">${segs(t,16)}</div><div class="lg"><span><i style="background:var(--agree)"></i>동의${t.pa<16?` <b>${t.pa}%</b>`:''}</span><span><i style="background:var(--unsure)"></i>모르겠음${t.pu<16?` <b>${t.pu}%</b>`:''}</span><span><i style="background:var(--disagree)"></i>비동의${t.pd<16?` <b>${t.pd}%</b>`:''}</span></div>`;

function downloadText(filename,text){
  try{const blob=new Blob(['﻿'+text],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},500);return true;}catch(e){return false;}
}

      else if(ix>=0){const id=S.sentences[ix].id;S.sentences.splice(ix,1);done();await DB.delSentence(id);}

    const mood=t.pa>=60?'동의가 뚜렷한 편이에요.':t.pd>=50?'동의하지 않는 쪽이 더 많아요.':Math.abs(t.pa-t.pd)<=12?'의견이 팽팽하게 갈려요.':'아직 한쪽으로 기울지 않았어요.';
    app.innerHTML=`<div class="step">${head}
      <div class="res-head" style="margin-top:24px">
        ${t.n>=MIN_N?`<div class="big num">${mineP}%<span>가 ${esc(me.name)}님과 같은 생각</span></div><p>${t.n}명이 답했어요. ${mood}</p>`:`<div class="big">답을 남겼어요</div><p>아직 ${t.n}명이 답했어요. 5명이 넘으면 비율을 보여 드릴게요.</p>`}

      </div>
      ${v?`<div class="mine-box"><div class="k">내 답 · ${SLABEL[v.stance]}</div>${v.reason?`<p>${esc(v.reason)}</p>`:'<p class="tiny" style="margin-top:2px">이유는 아직 안 남겼어요</p>'}${msx?`<p style="margin-top:6px">✎ ${esc(msx.body)}</p>`:''}<div class="x"><button type="button" class="btn xs sub" id="change">생각 바꾸기</button><button type="button" class="btn xs sub" id="editWhy">${v.reason?'이유 고치기':'이유 남기기'}</button><button type="button" class="btn xs sub" id="editLine">${msx?'한 줄 고치기':'한 줄 남기기'}</button></div></div>`:''}
      <div class="tabs" role="tablist">${['agree','unsure','disagree'].map(s=>`<button type="button" role="tab" data-t="${s}" aria-selected="${tab===s}">${s==='agree'?'동의 이유':s==='unsure'?'모르겠는 이유':'비동의 이유'}</button>`).join('')}</div>
      ${canSee?(reasons.length?`<div class="reasons">${reasons.map(x=>`<div class="rs ${x.uid===me.id?'mine':''}"><p>${esc(x.reason)}</p><div class="m"><span>${x.uid===me.id?'내 이유':who(um[x.uid])} · ${fmt(x.at)}</span><button type="button" class="like ${liked(x.id)?'on':''}" data-like="${x.id}">공감 <span class="num">${likeCnt(x.id)}</span></button></div></div>`).join('')}</div>`:`<div class="empty">아직 이 입장의 이유가 없어요.</div>`)
      :`<div class="lock"><span>🔒</span><span>다른 사람의 이유는 지금 관리자만 볼 수 있어요. 공개로 바뀌면 여기서 볼 수 있어요.</span></div>`}
      <div class="sec"><h2>${esc(a.prompt)}</h2><span class="tiny">${sents.length}개</span></div>
      ${canSeeS?(sents.length?`<div class="reasons">${sents.map(s=>`<div class="rs q ${s.uid===me.id?'mine':''}"><p>${esc(s.body)}</p><div class="m"><span>${s.uid===me.id?'내 한 줄':who(um[s.uid])}</span><button type="button" class="like ${liked(s.id)?'on':''}" data-like="${s.id}">공감 <span class="num">${likeCnt(s.id)}</span></button></div></div>`).join('')}</div>`:`<div class="empty">아직 없어요. 첫 한 줄을 남겨 볼까요?</div>`)
      :`<div class="lock"><span>🔒</span><span>다른 사람의 한 줄은 지금 관리자만 볼 수 있어요.</span></div>`}

    $('#back').onclick=()=>go({name:'home'});
    $$('.tabs [role=tab]').forEach(b=>b.onclick=()=>{view.tab=b.dataset.t;render();});
    $$('[data-like]').forEach(b=>b.onclick=()=>toggleLike(b.dataset.like));
    const c=$('#change');if(c)c.onclick=()=>{view.phase='ask';view.tab=null;render();};

    const el=$('#editLine');if(el)el.onclick=()=>{view.phase='line';render();};
    $('#next').onclick=()=>nextUn?go({name:'detail',aid:nextUn.id,phase:'ask'}):mySentence('final')?go({name:'results'}):go({name:'detail',aid:'final',phase:'line'});
  }
}

/* ---------- results ---------- */
function renderResults(app){
  const list=activeAgendas();const f=ovFilter;const um=umap();

  const spread=heat.map(h=>{const v=h.cells.filter(x=>x!=null);return {a:h.a,d:v.length>=2?Math.max(...v)-Math.min(...v):-1,cells:h.cells};}).sort((x,y)=>y.d-x.d)[0];
  const entryGap=list.map(a=>{const t1=tally(a.id,{company:f.company,tenure:f.tenure,entry:ENTRIES[0]}),t2=tally(a.id,{company:f.company,tenure:f.tenure,entry:ENTRIES[1]});return t1.n>=MIN_N&&t2.n>=MIN_N?{a,p1:t1.pa,p2:t2.pa,d:Math.abs(t1.pa-t2.pa)}:null;}).filter(Boolean).sort((x,y)=>y.d-x.d)[0];
  const reasonsAll=S.votes.filter(v=>v.reason&&!v.hidden&&inFilter(um[v.uid],f));
  const topReasons=reasonsAll.slice().sort((x,y)=>likeCnt(y.id)-likeCnt(x.id)).slice(0,3);
  const canSee=S.settings.reasonsPublic||adminOK;
  const byCompany=companyList().map(c=>({c,n:new Set(S.votes.filter(v=>(um[v.uid]||{}).company===c).map(v=>v.uid)).size})).filter(x=>x.n).sort((x,y)=>y.n-x.n);
  const maxC=Math.max(...byCompany.map(x=>x.n),1);
  app.innerHTML=`<div class="step">
    <div class="hero" style="padding-bottom:0"><h1>우리는 SKMS를<br>이렇게 보고 있어요</h1><p>${n}명의 답을 모았어요. 5명 미만 집단은 가려서 보여요.</p></div>
    <div class="filters">
      <select id="fc"><option value="">모든 회사</option>${companyList().map(c=>`<option ${f.company===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
      <select id="ft"><option value="">모든 연차</option>${TENURES.map(c=>`<option ${f.tenure===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
      <select id="fe"><option value="">신입·경력 전체</option>${ENTRIES.map(c=>`<option ${f.entry===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
      ${f.company||f.tenure||f.entry?'<button class="btn xs sub" id="fx" type="button" style="align-self:center">초기화</button>':''}
    </div>
    ${!rows.length?`<div class="empty" style="margin-top:16px">이 조건에서는 아직 결과를 보여 드릴 만큼 답이 모이지 않았어요.</div>`:`
    <div class="insights">
      ${contested?`<div class="ins hero"><div class="k">가장 팽팽한 주제</div><div class="v">“${esc(contested.a.statement)}”</div><div class="s"><b style="color:#8DB8FF">동의 ${contested.t.pa}%</b> vs <b style="color:#FF9A8B">비동의 ${contested.t.pd}%</b> · 모르겠음 ${contested.t.pu}% · ${contested.t.n}명</div></div>`:''}
      ${topAgree?`<div class="ins blue"><div class="k">가장 많이 동의</div><div class="v num">${topAgree.t.pa}%<small>동의</small></div><div class="s">${esc(topAgree.a.tag)} · ${esc(topAgree.a.statement)}</div></div>`:''}
      ${topDis&&topDis!==topAgree?`<div class="ins red"><div class="k">가장 많이 비동의</div><div class="v num">${topDis.t.pd}%<small>비동의</small></div><div class="s">${esc(topDis.a.tag)} · ${esc(topDis.a.statement)}</div></div>`:''}
      ${spread&&spread.d>=0?`<div class="ins" style="grid-column:1/-1"><div class="k">연차 간 온도차가 가장 큰 주제</div><div class="v num">${spread.d}<small>%p 차이</small></div><div class="s">${esc(spread.a.tag)} · ${esc(spread.a.statement)}<br><span class="tiny">${TENURES.map((l,i)=>spread.cells[i]==null?'':`${l} ${spread.cells[i]}%`).filter(Boolean).join(' · ')}</span></div></div>`:''}
    </div>

    <div class="sec"><h2>합의 지도</h2><span class="tiny">동의가 많을수록 위 · 탭하면 이유</span></div>
    <div class="dmap"><div class="hd"><span>← 동의하지 않아요</span><span>동의해요 →</span></div>
      ${sorted.map(({a,t})=>`<button type="button" class="drow" data-a="${a.id}"><div class="lab"><span>${esc(a.statement)}</span><span class="tg">${t.n}명 · 모르겠음 ${t.pu}%</span></div>
        <div class="tr"><i class="l" style="width:${t.pd/2}%"></i><i class="r" style="width:${t.pa/2}%"></i><span class="pl" style="right:calc(50% + ${t.pd/2}%)">${t.pd}%</span><span class="pr" style="left:calc(50% + ${t.pa/2}%)">${t.pa}%</span></div></button>`).join('')}
    </div>

    <div class="sec"><h2>연차별 동의율</h2><span class="tiny">진할수록 동의가 많아요</span></div>
    <div class="heat" style="grid-template-columns:minmax(70px,1.1fr) repeat(${TENURES.length},1fr)">
      <div></div>${TENURES.map(l=>`<div class="hh">${esc(l.replace('년 미만','년↓').replace('년 이상','년↑'))}</div>`).join('')}
      ${heat.map(h=>`<div class="hl" title="${esc(h.a.statement)}">${esc(h.a.tag)}</div>${h.cells.map(c=>c==null?`<div class="hc na">–</div>`:`<div class="hc ${c>=55?'dk':''}" style="background:rgba(49,130,246,${(0.08+c/100*0.92).toFixed(2)})" title="동의 ${c}%">${c}</div>`).join('')}`).join('')}
    </div>
    <div class="hscale"><span>0%</span><i></i><span>100% 동의</span></div>

    ${entryGap?`<div class="sec"><h2>신입 vs 경력, 가장 다른 주제</h2></div>
    <p style="font-weight:600;font-size:.95rem">${esc(entryGap.a.statement)}</p>
    <div class="pair"><div class="pc"><div class="k">${ENTRIES[0]}</div><div class="v num">${entryGap.p1}%<small>동의</small></div></div><div class="pc"><div class="k">${ENTRIES[1]}</div><div class="v num">${entryGap.p2}%<small>동의</small></div></div></div>`:''}

    <div class="sec"><h2>가장 공감받은 이유</h2></div>
    ${canSee?(topReasons.length?`<div class="reasons">${topReasons.map(x=>{const a=agendaById(x.aid)||{};return `<div class="rs q"><p>“${esc(x.reason)}”</p><div class="m"><span>${esc(a.tag||'')}에 <b>${SLABEL[x.stance]}</b> · ${who(um[x.uid])}</span><span>공감 ${likeCnt(x.id)}</span></div></div>`;}).join('')}</div>`:'<div class="empty">아직 남긴 이유가 없어요.</div>'):`<div class="lock"><span>🔒</span><span>이유는 지금 관리자만 볼 수 있어요.</span></div>`}

    <div class="sec"><h2>회사별 참여</h2></div>
    <div class="cbars">${byCompany.map(x=>`<div class="cb"><span>${esc(x.c)}</span><div class="tk"><i style="width:${x.n/maxC*100}%"></i></div><span class="n num">${x.n}명</span></div>`).join('')}</div>

  $('#fc').onchange=e=>{ovFilter.company=e.target.value;render();};
  $('#ft').onchange=e=>{ovFilter.tenure=e.target.value;render();};
  $('#fe').onchange=e=>{ovFilter.entry=e.target.value;render();};
  const fx=$('#fx');if(fx)fx.onclick=()=>{ovFilter={company:'',tenure:'',entry:''};render();};
  $$('.drow').forEach(b=>b.onclick=()=>go({name:'detail',aid:b.dataset.a,phase:myVote(b.dataset.a)?'result':'ask'}));
  const to=$('#toOurs');if(to)to.onclick=()=>go({name:'ours'});
}

/* ---------- ideas: Next SKMS 아이디어 게시판 (제안 → 스레드) ---------- */

    ${t?`<div class="tdesc"><b>${esc(t.title)}</b><p>${esc(t.desc||'')}</p></div>`:''}

    <div class="atabs" role="tablist">${tabs.map(([k,l])=>`<button type="button" role="tab" data-at="${k}" aria-selected="${tab===k}">${l}</button>`).join('')}</div>
    ${body}</div>`;
  $('#back').onclick=()=>go({name:'home'});
  $$('[data-at]').forEach(b=>b.onclick=()=>{view.atab=b.dataset.at;render();});
  $$('.seg[data-set]').forEach(sg=>sg.onclick=async e=>{const b=e.target.closest('button');if(!b)return;st[sg.dataset.set]=b.dataset.v==='1';render();if(await DB.saveSettings())toast('저장했어요');});
  const so=$('#saveOps');if(so)so.onclick=async()=>{st.name=$('#cname').value.trim()||st.name;{const old=st.ideaTopics||[];st.ideaTopics=$('#topics').value.split('\n').map(l=>l.trim()).filter(Boolean).map((l,ix)=>{const [title,...rest]=l.split('|');const tt=title.trim();const prev=old.find(t=>t.title===tt);return {id:prev?prev.id:'t_'+Date.now().toString(36)+ix,title:tt,desc:rest.join('|').trim()};});}st.notice=$('#notice').value.trim();st.closeAt=$('#closeAt').value;st.allowedDomains=$('#domains').value.split(',').map(x=>x.trim()).filter(Boolean);st.companies=$('#companies').value.split('\n').map(x=>x.trim()).filter(Boolean);if(await DB.saveSettings())toast('저장했어요');render();};
  const ls=$('#loadStats');if(ls)ls.onclick=async()=>{ls.disabled=true;try{view.stats=await DB.stats();render();}catch(e){console.error(e);toast('불러오지 못했어요');ls.disabled=false;}};
  const cs2=$('#cmpSel');if(cs2)cs2.onchange=async()=>{view.cmp=cs2.value;if(view.cmp&&!view.stats){try{view.stats=await DB.stats();}catch(e){}}render();};
  $$('[data-copyurl]').forEach(b=>b.onclick=async()=>{const url=campaignUrl(b.dataset.copyurl);try{await navigator.clipboard.writeText(url);toast('링크를 복사했어요');}catch(e){prompt('링크를 복사하세요',url);}});
  const ncs=$('#ncSlug');if(ncs){const pv=()=>{const v=ncs.value.trim().toLowerCase();ncs.value=v;$('#ncPreview').textContent=v?(slugOk(v)?(CAMPS[v]?'이미 있는 코드예요':campaignUrl(v)):'영문 소문자·숫자·하이픈만, 2자 이상'):'';};ncs.oninput=pv;
    $('#ncMake').onclick=async()=>{const name=$('#ncName').value.trim(),slug=ncs.value.trim();if(!name){toast('회차 이름을 적어 주세요');return;}if(!slugOk(slug)||CAMPS[slug]||slug==='main'&&C!=='main'){toast('링크 코드를 확인해 주세요');return;}
      const data=$('#ncCopy').checked?JSON.parse(JSON.stringify(S.settings)):defaultSettings();data.name=name;data.createdAt=new Date().toISOString().slice(0,10);data.notice='';data.closeAt='';
      if(await DB.saveCampaign(slug,data)){view.stats=null;render();toast('만들었어요. 링크를 복사해 보내세요');}};}
  $$('[data-tog]').forEach(b=>b.onclick=async()=>{const a=agendas().find(x=>x.id===b.dataset.tog);a.active=!a.active;render();await DB.saveSettings();});
  $$('[data-up]').forEach(b=>b.onclick=async()=>{const arr=agendas();const i=arr.findIndex(x=>x.id===b.dataset.up);if(i>0){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];render();await DB.saveSettings();}});
  $$('[data-down]').forEach(b=>b.onclick=async()=>{const arr=agendas();const i=arr.findIndex(x=>x.id===b.dataset.down);if(i>=0&&i<arr.length-1){[arr[i+1],arr[i]]=[arr[i],arr[i+1]];render();await DB.saveSettings();}});
  $$('[data-edit]').forEach(b=>b.onclick=()=>{view.editId=b.dataset.edit;render();});
  const na=$('#newAg');if(na)na.onclick=()=>{view.editId='new';render();setTimeout(()=>$('.aform .f-tag')?.focus(),50);};
  $$('[data-cancel]').forEach(b=>b.onclick=()=>{view.editId=null;render();});
  $$('.f-dir').forEach(sg=>sg.onclick=e=>{const bt=e.target.closest('button');if(!bt)return;$$('button',sg).forEach(x=>x.setAttribute('aria-pressed',String(x===bt)));});
  $$('[data-save]').forEach(b=>b.onclick=async()=>{const f=b.closest('.aform');const g=c=>$(c,f).value.trim();const stx=g('.f-st'),fill=g('.f-fill');
    if(!stx){toast('문장을 적어 주세요');return;} if(fill&&!fill.includes('___')){toast('빈칸 문장에는 ___ 를 넣어 주세요');return;}
    const dir=$('.f-dir [aria-pressed="true"]',f)?.dataset.v||'critical';
    const rec={tag:g('.f-tag')||'새 주제',statement:stx,context:g('.f-ctx'),prompt:g('.f-pr')||'이 주제로 내가 다시 쓰는 SKMS',fill:fill||'나에게 이것은 ___',dir};
    if(b.dataset.save==='new'){agendas().push(Object.assign({id:'a_'+Date.now(),active:true},rec));}else{Object.assign(agendas().find(x=>x.id===b.dataset.save),rec);}
    view.editId=null;render();if(await DB.saveSettings())toast(b.dataset.save==='new'?'추가했어요. 홈에 바로 보여요':'저장했어요');});
  $$('[data-del]').forEach(b=>b.onclick=async()=>{const a=agendas().find(x=>x.id===b.dataset.del);const n=tally(a.id).n;if(!confirm(`"${a.statement}"\n\n이 생각거리와 답 ${n}건, 한 줄을 모두 지울까요? 되돌릴 수 없어요.\n(답을 남기려면 '내리기'를 쓰세요)`))return;
    const tids=new Set([...S.votes.filter(v=>v.aid===a.id).map(v=>v.id),...S.sentences.filter(x=>x.aid===a.id).map(x=>x.id)]);
    S.votes=S.votes.filter(v=>v.aid!==a.id);S.sentences=S.sentences.filter(x=>x.aid!==a.id);S.likes=S.likes.filter(l=>!tids.has(l.tid));
    S.settings.agendas=agendas().filter(x=>x.id!==a.id);localSave();render();
    if(REMOTE){if(await remoteTry(()=>DB.admin('delete_agenda',{campaign:C,aid:a.id,settings:S.settings})))toast('삭제했어요');}else toast('삭제했어요');});
  const rq=$('#rq');if(rq){rq.oninput=()=>{view.q=rq.value;clearTimeout(rq._t);rq._t=setTimeout(()=>{render();const el=$('#rq');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},250);};}
  $$('[data-hide]').forEach(b=>b.onclick=async()=>{const id=b.dataset.hide;const v=S.votes.find(x=>x.id===id);const s=S.sentences.find(x=>x.id===id);const i=S.ideas.find(x=>x.id===id);const c=S.comments.find(x=>x.id===id);const rec=v||s||i||c;if(!rec)return;rec.hidden=!rec.hidden;localSave();render();if(REMOTE)await remoteTry(()=>DB.admin('hide',{kind:v?'vote':s?'sentence':i?'idea':'comment',id,hidden:rec.hidden}));});
  const cd=$('#clearDemo');if(cd)cd.onclick=()=>{const ids=new Set(S.users.filter(u=>u.demo).map(u=>u.id));const tids=new Set([...S.votes.filter(v=>ids.has(v.uid)).map(v=>v.id),...S.sentences.filter(s=>ids.has(s.uid)).map(s=>s.id)]);S.users=S.users.filter(u=>!ids.has(u.id));S.votes=S.votes.filter(v=>!ids.has(v.uid));S.sentences=S.sentences.filter(s=>!ids.has(s.uid));const iids=new Set(S.ideas.filter(i=>ids.has(i.uid)).map(i=>i.id));S.ideas=S.ideas.filter(i=>!ids.has(i.uid));S.comments=S.comments.filter(c=>!ids.has(c.uid)&&!iids.has(c.ideaId));S.likes=S.likes.filter(l=>!ids.has(l.uid)&&!tids.has(l.tid)&&!iids.has(l.tid));localSave();render();toast('예시 데이터를 지웠어요');};
  const ra=$('#resetAll');if(ra)ra.onclick=()=>{if(!confirm('모든 응답과 설정을 지울까요? 되돌릴 수 없어요.'))return;S=defaults();S.seeded=true;localSave();me=null;adminOK=false;try{sessionStorage.clear();}catch(e){}go({name:'home'});};
  const dl=$('#csvDl');if(dl)dl.onclick=async()=>{dl.disabled=true;try{const text=await buildExport();const name=`skms_voice_${new Date().toISOString().slice(0,10)}.csv`;if(downloadText(name,text))toast('다운로드를 시작했어요. 안 되면 복사용 보기를 쓰세요');else{const ta=$('#csvOut');ta.value=text;ta.hidden=false;ta.select();toast('다운로드가 막혀 있어 복사용으로 보여드려요');}}catch(e){console.error(e);toast('내보내기에 실패했어요');}dl.disabled=false;};
  const cv=$('#csvView');if(cv)cv.onclick=async()=>{try{const text=await buildExport();const ta=$('#csvOut');ta.value=text;ta.hidden=false;ta.focus();ta.select();}catch(e){toast('내보내기에 실패했어요');}};
}

/* ---------- boot ---------- */
$('#modeTag').hidden=REMOTE;
window.addEventListener('error',e=>{const l=$('#loading');if(l)l.innerHTML='<div style="padding:24px;text-align:center"><b>화면을 여는 중 문제가 생겼어요</b><br><span class="tiny">'+esc(e.message||'')+'</span><br><button class="btn sm sub" style="margin-top:14px" onclick="location.reload()">다시 시도</button></div>';});
try{
  if(REMOTE){
    try{await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js');}catch(e){throw new Error('저장소 라이브러리를 불러오지 못했어요 (네트워크 차단 여부를 확인해 주세요)');}
    sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);
    await remoteLoad();
  }else{localLoad();}
  try{me=JSON.parse(localStorage.getItem(KEYC+'_me')||'null');const ap=sessionStorage.getItem(KEY+'_admin');if(ap){adminPin=ap;adminOK=true;}}catch(e){}
  if(me&&!S.users.find(u=>u.id===me.id)){if(REMOTE)S.users.push(me);else me=null;}
  if(!REMOTE&&adminOK&&adminPin!==LOCAL_PIN)adminOK=false;
}catch(e){console.error(e);$('#loading').innerHTML='<div style="padding:24px;text-align:center"><b>데이터를 불러오지 못했어요</b><br><span class="tiny">'+esc(e&&e.message||e)+'</span><br><button class="btn sm sub" style="margin-top:14px" onclick="location.reload()">다시 시도</button></div>';return;}
$('#brandName').textContent=S.settings.name||'SKMS 아고라';document.title=S.settings.name||'SKMS 아고라';if(C!=='main'){$('#campTag').textContent=C;$('#campTag').hidden=false;}
$('#loading').remove();
window.addEventListener('focus',()=>{if(REMOTE&&me&&view.name!=='detail')maybeRefresh().then(render);});
render();
})();
</script>
</body></html>
